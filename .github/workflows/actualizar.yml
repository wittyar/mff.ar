name: Actualizar datos MFF
on:
  workflow_dispatch:
  # Semanal (lunes 06:00 UTC): la app instalada baja lo que publique esta corrida.
  # GitHub desactiva los programados de un repo público sin actividad en 60 días; el
  # commit semanal de datos cuenta como actividad.
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Bajar datos (sin retratos; los íconos sí, son insumo del build) y aceptar o no la guía de armado
        run: python scripts/fetch_all.py --no-portraits
      - name: Sacar instintos de la wiki
        run: python scripts/parse_instinto.py
      - name: Reconstruir data.js, datos.json, el import y el informe de auditoría
        run: python scripts/build.py
      - name: Commitear si hay cambios
        run: |
          git config user.name "mff-bot"
          git config user.email "mff-bot@users.noreply.github.com"
          git add data.js datos.json mff-thanosvibs-import.json docs/AUDITORIA.md fuentes/guia-armado
          git diff --cached --quiet && echo "Sin cambios" || {
            git commit -m "Datos actualizados $(date +%F)"
            git push
          }
