name: Actualizar datos MFF
on:
  workflow_dispatch:
  # Descomentar para corrida automática semanal (lunes 06:00 UTC):
  # schedule:
  #   - cron: '0 6 * * 1'
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bajar datos (sin imágenes; no van al repo)
        run: python scripts/fetch_all.py --no-images
      - name: Parsear skills
        run: python scripts/parse_skills.py
      - name: Reconstruir data.js e import
        run: python scripts/build.py
      - name: Commitear si hay cambios
        run: |
          git config user.name "mff-bot"
          git config user.email "mff-bot@users.noreply.github.com"
          git add data.js mff-thanosvibs-import.json
          git diff --cached --quiet && echo "Sin cambios" || {
            git commit -m "Datos actualizados $(date +%F)"
            git push
          }
